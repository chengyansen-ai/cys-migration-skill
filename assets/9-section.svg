  <rect width="1120" height="540" fill="url(#bg9)" rx="18"/>
  <text x="44" y="50" fill="#ffffff" font-size="26" font-weight="800">9 段式模板结构</text>
  <text x="44" y="78" fill="#94a3b8" font-size="15">前 4 段（人物·面容·妆容·身材）固定真实感内核，跨图复用 ｜ 后 5 段按场景灵活变化</text>

