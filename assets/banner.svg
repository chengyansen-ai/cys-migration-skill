<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="cys 人像提示词工程">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#231a4d"/>
      <stop offset="1" stop-color="#0a1c38"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- 背景光晕 -->
  <circle cx="930" cy="180" r="220" fill="url(#halo)"/>

  <!-- 右侧装饰：镜头光圈 + 飘带 -->
  <g transform="translate(930,180)" stroke-linecap="round" fill="none">
    <circle r="120" stroke="url(#neon)" stroke-width="2" opacity="0.55"/>
    <circle r="92" stroke="#7c5cff" stroke-width="1.2" opacity="0.45" stroke-dasharray="6 10"/>
    <circle r="64" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
    <path d="M -150 -40 C -60 -120, 60 -120, 150 -30" stroke="url(#ribbon)" stroke-width="10" opacity="0.8" filter="url(#soft)"/>
    <path d="M -150 60 C -50 130, 70 120, 150 50" stroke="url(#ribbon)" stroke-width="8" opacity="0.6" filter="url(#soft)"/>
    <circle cx="-40" cy="-70" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="80" cy="-90" r="2.5" fill="#22d3ee"/>
    <circle cx="120" cy="20" r="3" fill="#ff2e97" opacity="0.9"/>
    <circle cx="-90" cy="40" r="2" fill="#7c5cff"/>
  </g>

  <!-- 左侧文字 -->
  <text x="64" y="78" fill="url(#neon)" font-size="20" font-weight="700" letter-spacing="3" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">CYS · AI PORTRAIT PROMPT ENGINEERING</text>
  <text x="60" y="148" fill="#ffffff" font-size="52" font-weight="800" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">人像提示词工程</text>
  <text x="64" y="190" fill="#cbd5e1" font-size="21" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">9 段式模板 · Krea2 生产级实测 · 真实摄影质感</text>

  <!-- chips -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="600">
    <rect x="64" y="220" width="190" height="40" rx="20" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="159" y="245" fill="#7fe7f5" text-anchor="middle">全身 / 半身双版本</text>
    <rect x="266" y="220" width="170" height="40" rx="20" fill="#7c5cff" fill-opacity="0.12" stroke="#7c5cff" stroke-opacity="0.6"/>
    <text x="351" y="245" fill="#b9a6ff" text-anchor="middle">千条级批量生成</text>
    <rect x="448" y="220" width="150" height="40" rx="20" fill="#ff2e97" fill-opacity="0.12" stroke="#ff2e97" stroke-opacity="0.6"/>
    <text x="523" y="245" fill="#ff8fc4" text-anchor="middle">无硬约束束缚</text>
  </g>

  <!-- 底部霓虹线 -->
  <rect x="0" y="344" width="1200" height="4" fill="url(#neon)"/>
</svg>
